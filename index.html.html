<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sim Pelayar – Kuiz Penjelajahan Barat</title>
<style>
:root{--bg:#e6f6ff;--card:#fff;--ink:#12324a;--mut:#5d7a90;--pri:#1fa7e8;--ok:#2fb344;--bad:#e5484d;--line:#c9e4f4;--soft:#f2faff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a26;--card:#16293a;--ink:#e6f3ff;--mut:#93aec3;--line:#28455d;--soft:#10202e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a26;--card:#16293a;--ink:#e6f3ff;--mut:#93aec3;--line:#28455d;--soft:#10202e;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:0 0 8px}
.mut{color:var(--mut);font-size:14px}
.sim{display:flex;gap:14px;align-items:center}
.av{position:relative;width:84px;height:104px;flex:none;text-align:center}
.plumb{width:22px;height:22px;margin:0 auto;background:var(--pl,#3ddc5a);transform:rotate(45deg) scaleY(1.3);border-radius:3px;box-shadow:0 0 14px var(--pl,#3ddc5a);animation:fl 1.6s ease-in-out infinite;transition:background .5s}
@keyframes fl{0%,100%{margin-top:2px}50%{margin-top:10px}}
.face{font-size:54px;line-height:1;margin-top:12px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.bub{position:absolute;left:62px;top:-6px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:1px 9px;font-size:13px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .2s}
.bub.on{opacity:1}
.needs{flex:1;min-width:0}
.bar{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:13px}
.bar b{width:62px;font-weight:700}
.tr{flex:1;height:10px;background:var(--soft);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fi{height:100%;width:0;border-radius:8px;transition:width .5s,background .5s}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.pill{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:13px;font-weight:700}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:11px 18px;font-weight:800;width:100%;margin-top:8px}
.btn.sm{width:auto;padding:4px 12px;margin:0;font-size:13px;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.opt{display:block;width:100%;text-align:left;background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:11px 14px;margin:8px 0;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--pri);transform:translateX(3px)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.q{font-size:18px;font-weight:800;margin:4px 0 6px}
.fb{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--soft);border-left:5px solid var(--pri);font-size:15px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ch{flex:1 1 110px;text-align:center;background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:10px 6px;font-size:14px}
.ch .e{font-size:34px;display:block}
.ch.sel{border-color:var(--pri);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 30%,transparent)}
input[type=text]{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--soft);color:var(--ink)}
.room{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;background:var(--soft);border:2px dashed var(--line);border-radius:14px;padding:8px;font-size:22px;text-align:center}
.room span{opacity:.18;filter:grayscale(1);transition:.4s}.room span.on{opacity:1;filter:none;animation:pop .5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
.big{font-size:56px;text-align:center}
.prog{height:6px;background:var(--soft);border-radius:6px;overflow:hidden;margin-bottom:10px}.prog i{display:block;height:100%;background:var(--pri);transition:width .4s}
</style></head><body><div class="wrap" id="app"></div>
<script>
var CH=[
{t:"Lot 1 · Christopher Columbus",e:"🏝️",d:"Pelayar Genoa yang belayar ke barat merentasi Atlantik. Jom kenali beliau!"},
{t:"Lot 2 · Vasco da Gama",e:"⛵",d:"Pelayar Portugis yang menemui laluan laut ke India. Siap sedia, Sim!"},
{t:"Lot 3 · Ferdinand Magellan",e:"🌍",d:"Ekspedisi yang mengelilingi dunia buat kali pertama. Lot terakhir!"}];
var Q=[
["Christopher Columbus berasal dari bandar mana?","Genoa, Itali",["Lisbon, Portugal","Madrid, Sepanyol","Venice, Itali"],"Columbus (1451–1506) berasal dari Genoa, Itali, tetapi dibiayai oleh Raja Ferdinand II dan Ratu Isabella I dari Sepanyol."],
["Pada tahun bilakah Columbus mengetuai ekspedisi pertama merentasi Lautan Atlantik?","1492",["1498","1519","1522"],"Ekspedisi pertama bermula pada tahun 1492 dan beliau tiba di Bahamas pada 12 Oktober."],
["Pulau manakah yang dinamakan Columbus pada 12 Oktober 1492?","San Salvador (Bahamas)",["Hispaniola","Trinidad","Kalikut"],"Beliau tiba di sebuah pulau di Kepulauan Bahamas dan menamakannya San Salvador."],
["Apakah kesilapan Columbus ketika tiba di Bahamas?","Menyangka beliau sudah sampai ke kawasan berhampiran Asia",["Menyangka beliau sudah sampai ke Afrika","Menyangka beliau sudah mengelilingi dunia","Menyangka pulau itu milik Portugal"],"Columbus menyangka sudah dekat Asia, sedangkan kawasan itu sebahagian daripada benua Amerika."],
["Sistem nombor berasaskan 60 (seksagesimal) ialah sumbangan tamadun mana?","Mesopotamia",["Rom","Yunani","Indus"],"Mesopotamia memperkenalkan sistem seksagesimal yang membantu pengiraan masa dan sudut, asas ilmu pelayaran."],
["Tokoh Yunani Eratosthenes terkenal kerana menganggarkan apa?","Ukur lilit bumi",["Arah angin monsun","Kedudukan Kalikut","Bilangan bintang"],"Eratosthenes menganggarkan ukur lilit bumi. Columbus pula menggunakan anggaran jarak bumi yang terlalu kecil."],
["Vasco da Gama terkenal kerana menemui laluan laut dari Eropah ke India dengan mengelilingi apa?","Tanjung Harapan",["Selat Magellan","Laut Merah","Bahamas"],"Beliau mengelilingi Tanjung Harapan di selatan Afrika untuk sampai ke India."],
["Vasco da Gama bertolak dari Lisbon pada 1497 atas arahan siapa?","Raja Manuel I",["Raja Ferdinand II","Ratu Isabella I","Laksamana Zheng He"],"Ekspedisi bermula dari Lisbon, Portugal, atas arahan Raja Manuel I."],
["Di manakah Vasco da Gama tiba di India pada tahun 1498?","Kalikut (Calicut)",["Hispaniola","Mactan","Maluku"],"Beliau berjaya tiba di Kalikut (Calicut), India, pada tahun 1498."],
["Firaun Mesir Purba pernah menghantar ekspedisi perdagangan ke negeri mana?","Punt",["Mactan","Malindi","Lothal"],"Ekspedisi ke Punt untuk kemenyan dan bahan aromatik membuktikan Mesir Purba sudah belayar jauh sebelum Vasco da Gama."],
["Laksamana Zheng He mengetuai ekspedisi laut China pada abad ke berapa?","Abad ke-15",["Abad ke-10","Abad ke-18","Abad ke-20"],"Ekspedisi Zheng He pada abad ke-15 menjangkau Asia Tenggara, India, Semenanjung Arab dan Afrika Timur, sebelum Vasco da Gama tiba di India."],
["Jurumudi yang membantu Vasco da Gama menyeberangi Lautan Hindi berasal dari mana, dan siapa BUKAN beliau?","Dari Malindi, dan beliau bukan Ahmad Ibn Majid",["Dari Lisbon, dan beliau ialah Ibn Majid","Dari Kalikut, dan beliau ialah Zheng He","Dari Genoa, dan beliau ialah Eratosthenes"],"Menurut kajian Philippe Beaujard, jurumudi dari Malindi itu bukan Ibn Majid, walaupun ada penulisan sejarah yang keliru."],
["Magellan berbangsa apa, dan siapa yang menyokong ekspedisinya pada 1519?","Berbangsa Portugis, disokong Sepanyol",["Berbangsa Sepanyol, disokong Portugal","Berbangsa Itali, disokong England","Berbangsa Portugis, disokong China"],"Magellan seorang pelayar Portugis, tetapi ekspedisi 1519 disokong kerajaan Sepanyol dengan lima buah kapal."],
["Apakah nama laluan di selatan Amerika Selatan yang ditemui ekspedisi Magellan pada 1520?","Selat Magellan",["Tanjung Harapan","Selat Bahamas","Laluan Calicut"],"Selepas selat itu, rombongan memasuki Lautan Pasifik."],
["Di manakah Magellan terbunuh pada tahun 1521?","Pulau Mactan, Filipina",["Kepulauan Maluku","Bahamas","Malindi"],"Magellan terbunuh dalam pertempuran di Pulau Mactan, Filipina."],
["Siapakah yang meneruskan ekspedisi dan kapal apa yang pulang ke Sepanyol pada 1522?","Juan Sebastián Elcano, kapal Victoria",["Vasco da Gama, kapal Niña","Columbus, kapal Pinta","Zheng He, kapal Santa María"],"Elcano meneruskan pelayaran dan kapal Victoria kembali ke Sepanyol pada 1522, melengkapkan pelayaran pertama mengelilingi dunia."],
["Magellan mencari laluan ke Kepulauan Rempah, khususnya Maluku. Apakah rempah yang terkenal di sana?","Bunga cengkih dan buah pala",["Lada hitam dan kayu manis","Kemenyan dan mur","Sutera dan mutiara"],"Maluku, Indonesia, terkenal dengan bunga cengkih dan buah pala."],
["Apakah yang dikesan anak kapal Magellan selepas mengelilingi bumi?","Perbezaan satu hari dalam catatan tarikh",["Perbezaan satu bulan dalam kalendar","Bumi berbentuk rata","Lautan Pasifik sangat sempit"],"Anak kapal mendapati ada perbezaan satu hari dalam catatan tarikh selepas kembali mengelilingi bumi."]];
var ITEMS=["🧭","🗺️","⚓","🚢","🔭","📜","🪙","🐚","🏝️","⛵","🌬️","🧉","🏺","🧂","🌶️","🐪","🌍","🏆"];
var AV=[["🧑‍🎓","Pelajar"],["👩‍🎓","Pelajar"],["🧕","Cikgu"],["🧑‍✈️","Kapten"]];
var TR=[["🧠","Genius","Ilmu naik lebih laju"],["😄","Ceria","Mood tak mudah jatuh"],["💰","Kaya","Simoleon lebih banyak"]];
var S,app=document.getElementById("app");
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function cl(v){return Math.max(0,Math.min(100,v))}
function mood(){var m=S.mood;if(S.streak>=3)return["Terilham ✨","#b57bff"];if(m>=75)return["Gembira","#3ddc5a"];if(m>=50)return["Selesa","#b7e03a"];if(m>=25)return["Bosan","#f5a524"];return["Tertekan","#e5484d"]}
function start(){
S={name:"Nazem",av:0,tr:0,i:0,mood:70,ilmu:0,ener:80,money:0,streak:0,score:0,got:[]};
app.innerHTML='<div class="card"><div class="big">🌿💎</div><h1 style="text-align:center">Sim Pelayar</h1><p class="mut" style="text-align:center;margin-top:0">Hidupkan Sim anda dan jawab soalan penjelajahan Barat untuk naikkan Mood, Ilmu dan Simoleon (§). Ada 18 soalan dalam 3 lot.</p>'
+'<h2>Cipta-a-Sim</h2><input type="text" id="nm" maxlength="16" value="Nazem" aria-label="Nama Sim"><div class="opts" id="avs"></div><div class="opts" id="trs"></div>'
+'<button class="btn" onclick="go()">▶ Mula Hidup!</button></div>';
drawCas()}
function drawCas(){
document.getElementById("avs").innerHTML=AV.map(function(a,i){return'<button class="ch '+(i==S.av?"sel":"")+'" onclick="S.av='+i+';drawCas()"><span class="e">'+a[0]+'</span>'+a[1]+'</button>'}).join("");
document.getElementById("trs").innerHTML=TR.map(function(a,i){return'<button class="ch '+(i==S.tr?"sel":"")+'" onclick="S.tr='+i+';drawCas()"><span class="e">'+a[0]+'</span><b>'+a[1]+'</b><br><span class="mut">'+a[2]+'</span></button>'}).join("")}
function go(){S.name=document.getElementById("nm").value.trim()||"Sim";intro()}
function panel(){var m=mood();
return'<div class="card"><div class="top"><span class="pill">'+esc(S.name)+" · "+m[0]+'</span><span><span class="pill">§ '+S.money+'</span> <button class="btn sm" onclick="coffee()" '+(S.money<30||S.ener>=100?"disabled":"")+'>☕ Kopi §30</button></span></div>'
+'<div class="sim"><div class="av" style="--pl:'+m[1]+'"><div class="plumb"></div><div class="face">'+AV[S.av][0]+'</div><div class="bub" id="bub"></div></div><div class="needs">'
+bar("Mood","😊",S.mood,m[1])+bar("Ilmu","📚",S.ilmu,"#1fa7e8")+bar("Tenaga","⚡",S.ener,S.ener<20?"#e5484d":"#f5a524")+'</div></div></div>'}
function bar(n,e,v,c){return'<div class="bar"><b>'+e+" "+n+'</b><div class="tr"><div class="fi" style="width:'+v+'%;background:'+c+'"></div></div></div>'}
function room(){return'<div class="card"><h2>🏠 Bilik Koleksi</h2><div class="room">'+ITEMS.map(function(x,i){return"<span"+(S.got.indexOf(i)>-1?' class="on"':"")+">"+x+"</span>"}).join("")+'</div><p class="mut" style="margin:6px 0 0">Setiap jawapan betul membuka satu barang baharu.</p></div>'}
function say(t){var b=document.getElementById("bub");if(b){b.textContent=t;b.className="bub on";setTimeout(function(){b.className="bub"},1400)}}
function coffee(){if(S.money<30)return;S.money-=30;S.ener=cl(S.ener+30);S.mood=cl(S.mood+4);redraw(function(){say("Slurp! ☕")})}
var cur=null;
function redraw(cb){var keep=document.getElementById("qa");var h=keep?keep.innerHTML:null;var wrap=document.getElementById("pnl");if(wrap){wrap.innerHTML=panel()}if(cb)cb()}
function intro(){var c=CH[Math.floor(S.i/6)];
app.innerHTML='<div id="pnl">'+panel()+'</div><div class="card"><div class="big">'+c.e+'</div><h2 style="text-align:center">Hari '+(Math.floor(S.i/6)+1)+" · "+c.t+'</h2><p style="text-align:center">'+c.d+'</p><button class="btn" onclick="ask()">Masuk Lot ➜</button></div>'+room();setTimeout(function(){say("Sul sul!")},300)}
function ask(){var q=Q[S.i];var o=sh([[q[1],1]].concat(q[2].map(function(x){return[x,0]})));cur={o:o,done:false};
app.innerHTML='<div id="pnl">'+panel()+'</div><div class="card" id="qa"><div class="prog"><i style="width:'+(S.i/18*100)+'%"></i></div><div class="mut">'+CH[Math.floor(S.i/6)].t+" · Soalan "+(S.i+1)+" / 18"+(S.streak>=3?" · 🔥 Streak "+S.streak:"")+'</div><div class="q">'+esc(q[0])+'</div>'
+o.map(function(x,k){return'<button class="opt" onclick="pick('+k+')">'+esc(x[0])+'</button>'}).join("")+'<div id="fb"></div></div>'+room()}
function pick(k){if(cur.done)return;cur.done=true;var q=Q[S.i],t=TR[S.tr][1],ok=cur.o[k][1];
var bs=document.querySelectorAll(".opt");bs.forEach(function(b,j){b.disabled=true;if(cur.o[j][1])b.classList.add("ok");else if(j==k)b.classList.add("bad")});
var half=S.ener<20?0.5:1;
if(ok){S.score++;S.streak++;S.got.push(S.i);S.mood=cl(S.mood+8);S.ilmu=cl(S.ilmu+Math.round((t=="Genius"?9:6)*half));S.money+=Math.round((t=="Kaya"?75:50)*(S.streak>=3?2:1)*half)}
else{S.streak=0;S.mood=cl(S.mood-(t=="Ceria"?6:12));S.ener=cl(S.ener-10)}
S.ener=cl(S.ener-3);
var last=S.i==17,endCh=(S.i+1)%6==0;
document.getElementById("fb").innerHTML='<div class="fb"><b>'+(ok?"✅ Betul! +§"+(S.streak>=3?" (bonus ×2)":""):"❌ Belum tepat.")+'</b> '+esc(q[3])+(S.ener<20?'<br><span class="mut">⚡ Sim penat, ganjaran separuh. Minum kopi!</span>':"")+'</div><button class="btn" onclick="next()">'+(last?"Lihat Keputusan 🏆":endCh?"Habiskan Lot ➜":"Soalan Seterusnya ➜")+'</button>';
document.getElementById("pnl").innerHTML=panel();
var items=document.querySelectorAll(".room span");if(ok&&items[S.i])items[S.i].className="on";
say(ok?["Yew!","Boo-ah!","Nooboo!"][Math.floor(Math.random()*3)]:["Uh-oh…","Ooh-ah?","Dag dag…"][Math.floor(Math.random()*3)])}
function next(){S.i++;if(S.i>=18)return fin();if(S.i%6==0)intro();else ask()}
function fin(){var s=S.score,r=s>=16?["Sejarawan Legenda","🏆"]:s>=11?["Pelayar Hebat","🧭"]:s>=6?["Kadet Pelayaran","⚓"]:["Pelaut Baharu","🌱"];
app.innerHTML='<div id="pnl">'+panel()+'</div><div class="card" style="text-align:center"><div class="big">'+r[1]+'</div><h1>'+esc(S.name)+" ialah "+r[0]+'!</h1><p>Skor: <b>'+s+" / 18</b> · Ilmu "+S.ilmu+" · § "+S.money+'</p><p class="mut">'+(s>=16?"Wah, hampir sempurna. Sim anda layak jadi cikgu sejarah!":s>=11?"Mantap! Ulang sekali lagi untuk skor penuh.":"Tak apa, ulang kaji slaid dan cuba lagi. Sim pun belajar dari kesilapan!")+'</p><button class="btn" onclick="start()">🔁 Main Semula</button></div>'+room();setTimeout(function(){say(s>=11?"Yew!":"Sul sul!")},300)}
start();
</script></body></html>
